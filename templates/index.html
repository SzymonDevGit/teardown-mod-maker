<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.app.title }}</title>
  <script>
    // Open the language picked last time. English is the page at /.
    try {
      var saved = localStorage.getItem("tmm.lang");
      var pages = {{ pages|tojson }};
      if ({{ (lang == default_language)|tojson }} && saved && saved !== {{ lang|tojson }} && pages[saved]) {
        location.replace(pages[saved]);
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">{% for i in range(16) %}<i></i>{% endfor %}</span>
      <div>
        <h1>{{ t.app.title }}</h1>
        <p class="tagline">{{ t.app.tagline }}</p>
      </div>
    </div>
    <nav class="actions">
      <button id="btn-new" class="btn" data-term="new">{{ t.app.new }}</button>
      <button id="btn-open" class="btn" data-term="open">{{ t.app.open }}</button>
      <button id="btn-save" class="btn" data-term="save">{{ t.app.save }}</button>
      <button id="btn-code" class="btn" data-term="show_code">{{ t.app.show_code }}</button>
      <button id="btn-download" class="btn btn-primary" data-term="download">{{ t.app.download }}</button>
      <div class="lang" id="lang-switch" role="group" aria-label="{{ t.app.language }}" data-term="language">
        {% for code in pages %}
        <button type="button" class="lang-option" data-lang="{{ code }}" lang="{{ code }}"
          title="{{ {"en": "English", "pl": "Polski"}[code] }}" aria-pressed="{{ 'true' if code == lang else 'false' }}">{{ code|upper }}</button>
        {% endfor %}
      </div>
    </nav>
    <div class="hazard" aria-hidden="true"></div>
  </header>

  <main class="main">
    <div id="workspace" class="workspace" data-term="workspace"></div>
    <aside id="code-panel" class="code-panel" hidden>
      <h2>{{ t.app.code_title }}</h2>
      <p class="muted">{{ t.app.code_note }}</p>
      <pre><code id="code-output"></code></pre>
    </aside>
  </main>

  <footer class="hint-bar">
    <kbd>T</kbd> {{ t.app.help_hint }}
  </footer>

  <input type="file" id="open-file" accept=".json,application/json" hidden>

  <dialog id="download-dialog">
    <form id="download-form" method="dialog">
      <h2>{{ t.app.dialog_title }}</h2>
      <label>{{ t.app.mod_name }}
        <input name="name" id="mod-name" maxlength="60" required>
      </label>
      <label>{{ t.app.author }}
        <input name="author" id="mod-author" maxlength="60">
      </label>
      <label>{{ t.app.description }}
        <textarea name="description" id="mod-description" maxlength="300" rows="2"></textarea>
      </label>
      <label>{{ t.app.vox }}
        <input type="file" id="mod-vox" accept=".vox">
        <small class="muted">{{ t.app.vox_hint }}</small>
      </label>
      <p id="download-error" class="error" role="alert" hidden></p>
      <div class="install">
        <strong>{{ t.app.install_title }}</strong>
        <p>{{ t.app.install_steps }}</p>
      </div>
      <div class="dialog-buttons">
        <button type="button" id="download-cancel" class="btn">{{ t.app.cancel }}</button>
        <button type="submit" value="go" class="btn btn-primary">{{ t.app.download_go }}</button>
      </div>
    </form>
  </dialog>

  <div id="help-layer" class="help-layer" hidden>
    <div class="help-title">{{ t.app.help_title }}</div>
    <div class="help-glossary" id="help-glossary"></div>
  </div>

  <script>
    window.APP = {
      lang: {{ lang|tojson }},
      t: {{ t|tojson }},
      pages: {{ pages|tojson }},
      defaultVox: {{ url_for('static', filename='vox/tool.vox')|tojson }},
      blocklyMedia: "https://unpkg.com/blockly@{{ blockly_version }}/media/"
    };
  </script>
  <script src="https://unpkg.com/blockly@{{ blockly_version }}/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly@{{ blockly_version }}/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly@{{ blockly_version }}/lua_compressed.js"></script>
  <script src="https://unpkg.com/blockly@{{ blockly_version }}/msg/{{ lang }}.js"></script>
  <script src="{{ url_for('static', filename='js/modpack.js') }}"></script>
  <script src="{{ url_for('static', filename='js/blocks.js') }}"></script>
  <script src="{{ url_for('static', filename='js/help.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
